name: hrone_attendance
description: Automate HROne attendance punch-in and punch-out on a schedule.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  workmanager: ^0.5.2
  flutter_local_notifications: ^17.0.0
  intl: ^0.19.0
  otp: ^3.1.4        # TOTP code generation from secret key

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
